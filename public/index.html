    />
    <link rel="apple-touch-icon" href="/newlogo.svg" />
    <link rel="manifest" href="/manifest.json" />
    <title>BizzySite - Free Website Builder for Small Businesses</title>
    <link rel="preload" href="/newlogo.svg" as="image" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9BPXHYJEPY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9BPXHYJEPY');

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <style>
        .static-loader-container {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          height: 100vh;
          width: 100%;
          background-color: #f7fafc; /* A light gray background */
          font-family: Arial, sans-serif;
          color: #4a5568; /* A darker gray for text */
          text-align: center;
        }
        .static-loader-spinner {
          border: 4px solid rgba(0, 0, 0, 0.1);
          width: 40px;
          height: 40px;
          border-radius: 50%;
          border-left-color: #4f46e5; /* Indigo color to match your theme */
          animation: spin 1s ease infinite;
        }
        @keyframes spin {
          0% {
            transform: rotate(0deg);
          }
          100% {
            transform: rotate(360deg);
          }
        }
      </style>
      <div class="static-loader-container">
        <div class="static-loader-spinner"></div>
        <p style="margin-top: 20px; font-size: 16px;">Loading your store...</p>
      </div>
      </div>
  </body>
